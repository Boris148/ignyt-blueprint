<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>IGNYT 5 Blueprint · Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0d;color:#f4f1ec;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;padding:20px}
h1{font-size:26px;font-weight:200} h1 b{font-weight:800} h1 i{font-family:Georgia,serif;color:#f05a1e}
.bar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;align-items:center}
input{background:#17171b;border:1px solid #2c2c33;border-radius:10px;color:#fff;padding:10px 12px;font-size:15px}
button{background:#f05a1e;border:0;border-radius:10px;color:#fff;font-weight:700;padding:10px 16px;font-size:14px}
.k{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0} .k div{background:#17171b;border:1px solid #2c2c33;border-radius:12px;padding:10px 14px} .k b{display:block;font-size:22px}
.k span{font-size:11px;color:#9a958e;text-transform:uppercase;letter-spacing:1px}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th{text-align:left;color:#9a958e;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:8px;border-bottom:2px solid #f05a1e;cursor:pointer;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #2c2c33;white-space:nowrap} tr.d td:first-child{color:#ffb23e;font-weight:700}
.err{color:#ff7a6b;margin-top:8px}
</style></head><body>
<h1><b>Blueprint</b> <i>admin.</i></h1>
<div class="bar"><input id="key" type="password" placeholder="Admin key"><button id="go">Load</button><button id="csv" hidden>Download CSV</button><input id="q" placeholder="Filter by name or sponsor" hidden></div>
<div class="bar" id="rbar" hidden><input id="rp" placeholder="Phone to reset PIN"><button id="rgo">Reset PIN</button><span id="rout" style="font-weight:700"></span></div>
<div class="err" id="err"></div>
<div class="k" id="kpi"></div>
<div class="tw"><table id="t"></table></div>
<script>
const API='https://ignyt-challenge.hireboris.workers.dev/api', $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[], sortK='total', dir=-1;
const COLS=[['name','Name'],['sponsor','Sponsor'],['invitedBy','Invited by'],['phone','Phone'],['doneToday','5/5 today'],['streak','Streak'],['best','Best'],['days','Days 5/5'],['total','Exposures'],['texted','Texted'],['seen','Seen ✓'],['seenPct','Seen %'],['codeRequests','Code requests'],['customers','Customers'],['customerPacks','Customer packs'],['partners','Partners'],['partnerPacks','Partner packs'],['projected','Projected $'],['fbGroup','FB group'],['sms_ok','SMS OK'],['tz','Time zone'],['joined','Joined']];
$('key').value=localStorage.getItem('ig5_admin')||'';
const TOK=localStorage.getItem('ig5_tok'); const AH=()=>({...($('key').value?{'X-Admin-Key':$('key').value}:{}),...(TOK?{Authorization:'Bearer '+TOK}:{})});
if(TOK&&!$('key').value) setTimeout(()=>$('go').click(),0);
$('go').onclick=async()=>{ $('err').textContent='';
  const r=await fetch(API+'/admin',{headers:AH()}); const d=await r.json();
  if(!r.ok) return $('err').textContent=d.error||'Error';
  if($('key').value) localStorage.setItem('ig5_admin',$('key').value); rows=d; $('csv').hidden=$('q').hidden=$('rbar').hidden=false; draw(); };
$('rgo').onclick=async()=>{ $('rout').textContent=''; const r=await fetch(API+'/admin/reset',{method:'POST',headers:{...AH(),'Content-Type':'application/json'},body:JSON.stringify({phone:$('rp').value})}); const d=await r.json();
  $('rout').textContent=r.ok?`${d.name}'s temporary PIN: ${d.pin} — they can sign in with it now`:(d.error||'Error'); };
$('q').oninput=draw;
function draw(){
  const q=$('q').value.toLowerCase(), xs=rows.filter(r=>!q||(r.name+' '+r.sponsor).toLowerCase().includes(q)).sort((a,b)=>(a[sortK]>b[sortK]?1:a[sortK]<b[sortK]?-1:0)*dir);
  const S=(k)=>xs.reduce((a,r)=>a+(+r[k]||0),0);
  $('kpi').innerHTML=[[xs.length,'People'],[xs.filter(r=>r.doneToday).length,'5/5 today'],[S('total'),'Exposures'],[S('texted')?Math.round(100*S('seen')/S('texted'))+'%':'—','Links opened'],[S('customers'),'Customers'],[S('partners'),'Brand Partners'],['$'+S('projected').toLocaleString('en-US',{maximumFractionDigits:2}),'Projected commissions'],[xs.filter(r=>r.streak>=3).length,'3+ day streak']].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
  $('t').innerHTML='<tr>'+COLS.map(([k,l])=>`<th data-k="${k}">${l}${k===sortK?(dir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr>'+xs.map(r=>`<tr class="${r.doneToday?'d':''}">`+COLS.map(([k])=>`<td>${esc(k==='doneToday'||k==='sms_ok'||k==='fbGroup'?(r[k]?'✓':''):k==='joined'?r[k].slice(0,10):r[k])}</td>`).join('')+'</tr>').join('');
  document.querySelectorAll('th').forEach(th=>th.onclick=()=>{ if(sortK===th.dataset.k) dir=-dir; else {sortK=th.dataset.k; dir=-1;} draw(); });
}
$('csv').onclick=()=>{ const c=[COLS.map(x=>x[1]).join(',')].concat(rows.map(r=>COLS.map(([k])=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'})); a.download='ignyt5-blueprint-november.csv'; a.click(); };
</script></body></html>
