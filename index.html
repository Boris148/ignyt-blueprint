<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The IGNYT Blueprint</title>
<meta name="description" content="Choose your path — IGNYT Your Wellness or IGNYT Your Life.">
<link rel="icon" href="assets/drop.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0b0b0d;--paper:#ffffff;--orange:#f05a1e;--mut:#8f8f96;--body:#3a3a40}
html{-webkit-text-size-adjust:100%}
body{font-family:'Helvetica Neue',Helvetica,-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.orange{color:var(--orange)}
.top{padding:56px 24px 0;text-align:center}
.top svg{height:34px;color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 64px;text-align:center}
h1{font-size:clamp(38px,6vw,68px);font-weight:200;letter-spacing:-1.5px;line-height:1.05}
h1 b{font-weight:600}
.tag{margin-top:18px;font-size:clamp(17px,2vw,21px);color:var(--body);font-weight:300}
.doors{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:22px;width:min(960px,100%)}
@media(max-width:760px){.doors{grid-template-columns:1fr}}
.door{display:block;text-decoration:none;text-align:left;border-radius:22px;padding:44px 40px 40px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;min-height:260px;position:relative;overflow:hidden}
.door:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(11,11,13,.12)}
.door .k{font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:700;color:var(--orange)}
.door h2{margin-top:14px;font-size:clamp(28px,3.4vw,40px);font-weight:200;letter-spacing:-.5px;line-height:1.1}
.door h2 b{font-weight:600}
.door p{margin-top:12px;font-size:16px;font-weight:300;line-height:1.5}
.door .go{position:absolute;left:40px;bottom:32px;font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.d1{background:#fdfcfa;border:1px solid rgba(11,11,13,.09);color:var(--ink)}
.d1 p{color:var(--body)} .d1 .go{color:var(--orange)}
.d2{background:var(--ink);color:#f6f4ef}
.d2 p{color:#b9b6ae} .d2 .go{color:var(--orange)}
.d2 .flame{position:absolute;right:-26px;bottom:-40px;width:170px;opacity:.16}
footer{padding:26px;text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
footer b{color:var(--orange);font-weight:700}
.fade{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.fade.in{opacity:1;transform:none}
</style></head><body>
<div class="top"><svg viewBox="0 0 248 64"><text x="0" y="47" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="300" font-size="40" letter-spacing="14" fill="currentColor">IGNYT</text><g transform="translate(196,4)"><path d="M20.5 0 C26.5 9.5 35.5 17.5 35.5 31 A15.5 15.5 0 0 1 4.5 31 C4.5 17.5 14.5 9.5 20.5 0 Z" fill="#f05a1e"/><text x="20" y="38" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#ffffff">5</text></g></svg></div>
<main>
  <h1 class="fade">The <b>IGNYT</b> <span class="serif orange">Blueprint.</span></h1>
  <div class="tag fade">One family. Two paths. <span class="serif">Choose yours.</span></div>
  <div class="doors">
    <a class="door d1 fade" href="wellness.html">
      <div class="k">The Products</div>
      <h2>IGNYT Your <b>Wellness</b><span class="serif orange">.</span></h2>
      <p>The science, the products, and what they're designed to support.</p>
      <div class="go">Explore &rarr;</div>
    </a>
    <a class="door d2 fade" href="life.html">
      <div class="k">The Business</div>
      <h2>IGNYT Your <b>Life</b><span class="serif orange">.</span></h2>
      <p>It's as simple as 1, 2, 5. Watch the overview.</p>
      <div class="go">Watch &rarr;</div>
      <svg class="flame" viewBox="0 0 62 80"><path d="M31 2 C40 16 54 28 54 48 A23 23 0 0 1 8 48 C8 28 22 16 31 2 Z" fill="#f05a1e"/></svg>
    </a>
  </div>
</main>
<footer><b>ORYGN</b> &nbsp;&middot;&nbsp; IGNYT 5</footer>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.15});
document.querySelectorAll('.fade').forEach((el,i)=>{el.style.transitionDelay=(i*90)+'ms';io.observe(el)});
</script>
</body></html>
